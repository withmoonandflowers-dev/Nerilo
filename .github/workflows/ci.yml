# CI：品質門檻 + 可選 E2E，通過後可觸發部署
# 品質門檻失敗會擋住 PR / push；E2E 可設為可選或僅跑穩定子集

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  # 每日 02:17（台北）跑一次 master。觀察期原本按日曆走、證據卻只按推送走：
  # 2026-07-18 到 07-25 七天零推送＝七天零樣本，到期日到了手上卻沒資料（實測踩到）。
  # 排程觸發讓穩定度證據與提交節奏脫鉤，順帶抓得到「程式沒動但外部相依壞掉」這類問題。
  schedule:
    - cron: '17 18 * * *'

env:
  # Node 24 = npm 11, matching the dev machine that generates package-lock.json.
  # npm 10 (Node 20, EOL 2026-04) fails `npm ci` on union ranges like "^0.27.0 || ^0.28.0".
  NODE_VERSION: '24'

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true
        # 若希望嚴格擋下：改為 continue-on-error: false

      # 根層單元測試橫跨 web-vue 原始碼（useMeshHealth 取 web-vue/node_modules/vue、
      # gameRoomFlag 的 tsconfig 由 nuxt prepare 產生），需先備妥子包環境。
      - name: Install Vue dependencies (root unit tests span web-vue)
        run: npm ci --prefix web-vue

      - name: Prepare Nuxt types
        run: npx nuxt prepare
        working-directory: web-vue

      - name: Unit tests
        run: npm run test:run

      # 稽核不變量硬閘（core-invariants R8）：SDK 進入點必須脫離 Firebase。
      # 先建 dist（供 eager 進入點檢查），再跑靜態圖 + dist 雙檢；破則擋 merge。
      - name: Build SDK (dist)
        run: npm run build:sdk

      - name: QA gate — SDK firebase isolation
        run: npm run qa:sdk-isolation

  vue-quality:
    name: Vue Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-vue/package-lock.json

      # nuxt typecheck 涵蓋複用的根層 ../src（firebase/uuid 等型別在根層 node_modules），
      # 根層依賴不裝會整片 TS2307/TS7006。
      - name: Install root dependencies (shared ../src types)
        run: npm ci

      - name: Install Vue dependencies
        run: npm ci --prefix web-vue

      # 硬閘：接班版即使尚未 production，也不得合併型別壞掉或無法產出靜態站的版本。
      - name: Type check Vue app
        run: npm run type-check --prefix web-vue

      - name: Generate Vue static app
        run: npm run generate --prefix web-vue

  functions-quality:
    name: Functions Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Functions
        run: npm run build --prefix functions

  e2e:
    name: E2E (stable subset, emulator-backed)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    # Run inside the official Playwright image: browsers + system deps are
    # pre-baked, so we never hit the flaky `playwright install` CDN download
    # (it hung/timed out on ~every prior run). Tag MUST match @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Firebase emulators need a JRE — pin Java 21 explicitly (firebase-tools 15+ requires JDK 21+).
      - name: Setup Java 21 (for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      # 硬閘（2026-07-26 翻，稽核 R8 收斂）。翻閘依據＝實際發生的事，不是原註解宣稱的
      # 「自 07-13 起連續兩週」——這個 step 到 07-16（CI #149）才存在,07-13 當下還沒建。
      # 真實紀錄：#149/150(07-16)、#151-153(07-17)、#167-170(07-18)、#172-174(07-25)
      # 共 12 次執行、零紅，時長穩定 52-63s；07-26 本機重跑 11/11 通過 49.6s，
      # 時長對得上＝CI 的綠是真的跑完 11 條，不是零測試假綠。
      # 覆蓋期間誠實揭露：10 天跨度但只有 4 個活躍日（推送觸發的先天限制,已加 schedule 補）。
      - name: Run E2E stable subset against emulators
        run: npm run test:e2e:stable
        env:
          CI: 'true'
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  vue-e2e:
    name: Vue E2E (stable subset, emulator-backed)
    runs-on: ubuntu-latest
    needs: [quality, vue-quality]
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-vue/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm ci --prefix web-vue

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      # 2026-09-03 翻為硬閘：GitHub Actions API 查核 08-18 至 09-02 共 16 次排程，
      # Vue E2E job 與實際測試 step 全為 success，已滿足 ADR-0017 的兩週連續綠門檻。
      # @vue-warmup 必須與 stable 同一個 Playwright process 執行；只在指令列
      # 先寫檔名仍會被 --grep 排除，所以用兩個 tag 的 regex 一起選入。
      # 不要傳 --reporter：reporter 由 playwright.vue.config.ts 宣告（含 html），
      # 先前的 --reporter=list 蓋掉 config，底下的上傳報告步驟一路空跑。
      - name: Run Vue stable E2E against emulators
        run: >
          npx firebase-tools emulators:exec --only auth,firestore --project nerilo
          "npx playwright test --config playwright.vue.config.ts --grep '@vue-warmup|@vue-stable' --workers=1"
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'

      - name: Upload Vue Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-vue
          path: playwright-report/
          retention-days: 14

  # Deploy is handled by firebase-deploy.yml (service-account auth on master push).
  # The legacy token-based deploy job that lived here was never functional
  # (FIREBASE_TOKEN secret never set, gated on the soft E2E job) and would have
  # double-deployed alongside firebase-deploy.yml once E2E goes green.
