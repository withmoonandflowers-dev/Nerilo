# 7 人 partial mesh 矩陣（Spec 011 V1／Spec 016 驗收）。
# 單機 7 瀏覽器的資源需求超過開發機日常條件（V1 的 R-g 實測），
# 專用乾淨 runner 才是可重複的「低負載環境」。手動觸發＋每日排程，
# 不掛 PR 硬閘（資源重、且驗收口徑是連續多次綠，由人讀趨勢判定）。
name: E2E 7p Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # 04:30 台北，避開日常推送

env:
  NODE_VERSION: '24'

jobs:
  vue-e2e-7p:
    name: Vue E2E 7p matrix (emulator-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-vue/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm ci --prefix web-vue

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      # _warmup 先跑（見 e2e-e2ee.yml 註解）：單 spec workflow 的 nuxt dev 冷啟動
      # 會吃掉第一個產品斷言窗。7p 目前靠自身 20s 加入窗容忍過去，顯式預熱更穩。
      - name: Run warmup + 7p matrix against emulators
        run: >
          npx firebase-tools emulators:exec --only auth,firestore --project nerilo
          "npx playwright test --config playwright.vue.config.ts tests/e2e-vue/_warmup.spec.ts tests/e2e-vue/mesh-diagnostic-7p.spec.ts --workers=1 --reporter=list"
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-7p
          path: playwright-report/
          retention-days: 14
