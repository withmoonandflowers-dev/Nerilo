# mesh 群組 E2EE 驗證（tests/e2e-vue/mesh-e2ee.spec.ts：UI 明文／複本密文／
# 盲信使不可解）。此 spec 原不在 @vue-stable 與 E2E Full 任何 CI 集內（覆蓋缺口，
# 2026-08-02 本機連紅無從裁定）。專用 workflow＝覆蓋＋乾淨環境裁定＋stable 集
# 觀察期載體；連續綠後可議入 @vue-stable。手動觸發＋每日排程，不掛 PR 硬閘。
name: E2E Mesh E2EE

on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * *' # 04:45 台北，錯開 7p 輪（04:30）

env:
  NODE_VERSION: '24'

jobs:
  vue-e2ee:
    name: Vue mesh E2EE (emulator-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-vue/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Vue dependencies
        run: npm ci --prefix web-vue

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      # _warmup 先跑：nuxt dev server 首次編譯各路由可吃 >10s，單 spec 冷啟動會撞掉
      # 第一個產品斷言（實測兩次：createRoom 的 10s waiting URL 窗）。暖機用純路由
      # 預熱而非真 spec——用真 spec 當暖機時它自己會變成冷啟動的受害者（run #3 實證）。
      # 不要傳 --reporter：reporter 由 playwright.vue.config.ts 宣告（含 html）。
      # 先前這裡傳 --reporter=list 蓋掉 config，html 從未產生，下面的上傳步驟一路空跑。
      - name: Run warmup + mesh-e2ee against emulators
        run: >
          npx firebase-tools emulators:exec --only auth,firestore --project nerilo
          "npx playwright test --config playwright.vue.config.ts tests/e2e-vue/_warmup.spec.ts tests/e2e-vue/mesh-e2ee.spec.ts --workers=1"
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2ee
          path: playwright-report/
          retention-days: 14

      # error-context.md／截圖在 test-results/，失敗診斷實際靠這包
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2ee
          path: test-results/
          retention-days: 14
