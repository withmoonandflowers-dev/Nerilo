<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Nerilo 共享狀態示範（Spec 025）</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 2rem; background: #14141c; color: #ddd; }
      .peer { display: inline-block; vertical-align: top; width: 30%; margin-right: 1.5%; background: #1d1d28; border-radius: 8px; padding: 1rem; }
      pre { background: #101018; padding: .6rem; border-radius: 6px; min-height: 7rem; white-space: pre-wrap; }
      button { margin: .2rem .3rem .2rem 0; }
      #verdict.pass { color: #7c6; } #verdict.fail { color: #e66; }
    </style>
  </head>
  <body>
    <h1>共享狀態（LWW＋晚進者補齊）</h1>
    <p>A/B 先進房；按「C 晚進」讓第三個 client 加入並自動補齊現況。全部走真 WebRTC＋房金鑰加密。</p>
    <div id="peers"></div>
    <div style="margin-top:1rem">
      <button id="btn-a-score">A：記分 +1</button>
      <button id="btn-b-map">B：換地圖</button>
      <button id="btn-a-del">A：刪掉 note</button>
      <button id="btn-c-join">C 晚進</button>
    </div>
    <div id="verdict" style="margin-top:1rem">－</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
