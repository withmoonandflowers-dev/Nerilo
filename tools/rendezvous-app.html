<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Nerilo 區網聊天（會合點內建）</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #14141c; color: #ddd;
             display: flex; flex-direction: column; height: 100dvh; }
      header { padding: 10px 14px; background: #101018; font-size: 14px; }
      header .ok { color: #7c6; }
      #room, #me { color: #889; font-size: 12px; }
      #name { background: #1a1a24; color: #ccc; border: 1px solid #333; border-radius: 6px;
              padding: 2px 6px; font-size: 12px; width: 8em; }
      #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
      .msg { background: #1d2030; padding: 8px 12px; border-radius: 10px; max-width: 85%; font-size: 15px; }
      .msg b { display: block; font-size: 11px; color: #7a9; margin-bottom: 2px; }
      .msg.mine { align-self: flex-end; background: #24406b; }
      footer { display: flex; gap: 8px; padding: 10px; background: #101018; }
      #input { flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
               background: #1a1a24; color: #eee; }
      #send { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 0; background: #2f6fce; color: #fff; }
      #send:disabled, #input:disabled { opacity: .5; }
    </style>
  </head>
  <body>
    <header>
      <div id="status">連線中…</div>
      <div id="room"></div>
      <label id="me">名字：<input id="name" maxlength="12" /></label>
    </header>
    <div id="messages"></div>
    <footer>
      <input id="input" placeholder="說點什麼…" disabled autocomplete="off" />
      <button id="send" disabled>送出</button>
    </footer>
